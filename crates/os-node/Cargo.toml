[package]
name = "os-node"
version = "0.2.4"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
autobins = false
autotests = false

[features]
default = []
standalone-runtime = []

[[bin]]
name = "steelsearch"
path = "src/main.rs"
required-features = ["standalone-runtime"]

[[bin]]
name = "pit-context-benchmark"
path = "benchmarks/pit_context.rs"

[[test]]
name = "dev_cluster_daemons"
path = "tests/dev_cluster_daemons.rs"
required-features = ["standalone-runtime"]

[[test]]
name = "utoipa_poc"
path = "tests/utoipa_poc.rs"

[dependencies]
actix-web = { version = "=4.5.1", default-features = false, features = ["rustls-0_21"] }
actix-http = "=3.6.0"
bytes.workspace = true
bytestring = "=1.3.1"
base64.workspace = true
crc32fast.workspace = true
rustls = "0.21"
rustls-pemfile = "1"
url = "=2.5.0"
os-cluster-state = { path = "../os-cluster-state" }
os-core = { path = "../os-core" }
os-engine = { path = "../os-engine" }
os-engine-tantivy = { path = "../os-engine-tantivy" }
os-ml-commons = { path = "../os-ml-commons" }
os-node-rest-core = { path = "../os-node-rest-core" }
os-plugin-knn = { path = "../os-plugin-knn" }
os-rest = { path = "../os-rest" }
os-stream = { path = "../os-stream" }
os-transport = { path = "../os-transport" }
os-wire = { path = "../os-wire" }
humantime.workspace = true
regex = "1"
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10"
tokio.workspace = true
tracing.workspace = true

[dev-dependencies]
indexmap = "=2.7.0"
serde_json.workspace = true
utoipa = "4.2.3"
